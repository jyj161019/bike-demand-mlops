# 클라우드(GitHub Actions 러너)에서 학습하고, 모델·실행 기록을 저장소에 커밋한다.
# 실행: 저장소 → Actions → train → Run workflow → 버전 입력
name: train

on:
  workflow_dispatch:
    inputs:
      version:
        description: "새 모델 버전 (예: v1). 이미 있는 버전은 거절됨"
        required: true
      compare_with:
        description: "(선택) 평가 결과를 비교할 기존 버전 (재실행 확인용, 예: v1)"
        required: false
        default: ""

permissions:
  contents: write   # 이 저장소에 결과 커밋만 허용

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      COMPARE_WITH: ${{ inputs.compare_with }}
      MODEL_VERSION: ${{ inputs.version }}
      RUN_PLACE: "GitHub Actions train #${{ github.run_number }}"
      RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    steps:
      - uses: actions/checkout@v4

      - name: 버전 이름 검사
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9A-Za-z._-]{1,30}$ ]]; then
            echo "버전은 v로 시작하는 영문·숫자·. _ - 조합이어야 합니다: $VERSION"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 학습 + 평가
        run: ./scripts/run_and_log.sh train python -m src.train --data data/raw/SeoulBikeData.csv --version "$VERSION"

      - name: 기존 버전과 평가 결과 비교 (선택)
        if: ${{ inputs.compare_with != '' }}
        run: ./scripts/run_and_log.sh compare python -m src.compare "$COMPARE_WITH" "$VERSION"

      - name: 평가 결과 요약
        if: success()
        run: cat "models/$VERSION/evaluation.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 커밋 (실패해도 실행 기록은 남김)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs models || true
          if git diff --cached --quiet; then echo "커밋할 변경 없음"; exit 0; fi
          git commit -m "[train] $VERSION (Actions #${{ github.run_number }}, ${{ job.status }})"
          git pull --rebase origin main
          git push origin HEAD:main
