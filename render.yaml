# Render 서비스 설정 (Blueprint). 서비스 설정도 Git으로 버전 관리한다.
# 서비스할 모델 버전을 바꾸려면 MODEL_DIR 값을 바꿔 커밋·푸시한다.
services:
  - type: web
    name: bike-demand-api
    runtime: docker
    plan: free
    region: singapore          # 한국과 가장 가까운 Render 리전
    branch: main
    autoDeploy: true
    healthCheckPath: /health   # 모델을 못 읽으면 503 → 새 배포가 실패하고 이전 배포가 유지됨
    buildFilter:               # 실행 기록(logs/)만 바뀐 커밋으로는 다시 배포하지 않음
      paths:
        - app/**
        - src/**
        - models/**
        - Dockerfile
        - requirements.txt
        - render.yaml
    envVars:
      - key: MODEL_DIR
        value: /work/models/v1
      - key: LOG_DIR
        value: /tmp/logs
